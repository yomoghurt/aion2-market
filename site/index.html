<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11141a">
<title>AION2 相場ウォッチ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--ink:#16191f;--sub:#5d6573;--line:#e3e6eb;--chip:#eef0f4;
  --up:#0f9d58;--down:#d93a3a;--accent:#3d6df2;--accentInk:#fff;--warn:#b7791f;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1217;--panel:#171b22;--ink:#e8eaee;--sub:#97a0ae;--line:#262c36;--chip:#212732;
  --up:#36c37a;--down:#ff6b6b;--accent:#6e93ff;--accentInk:#0b0e13;--warn:#e0a84a;--shadow:none;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.top{display:flex;align-items:center;gap:10px}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em;flex:1;white-space:nowrap}
select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-height:38px}
select{max-width:52vw}
.meta{font-size:12px;color:var(--sub);margin:6px 0 8px;display:flex;gap:8px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:600}
.stale{color:var(--warn)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-selected=true]{background:var(--accent);color:var(--accentInk);font-weight:600}
main{padding:0 16px calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--sub);margin-bottom:10px}
.note b{color:var(--ink)}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools input{flex:1 1 160px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:2px 10px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.card:active{transform:scale(.995)}
.name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cat{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chg{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row3{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:4px;min-width:0}
.why{font-size:12.5px;color:var(--sub);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/-1;margin-top:4px}
.chip{font-size:11.5px;background:var(--chip);border-radius:6px;padding:1px 7px;color:var(--sub)}
.chip.u{color:var(--up)}.chip.d{color:var(--down)}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--sub)}
.score{font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;white-space:nowrap}
.score.u{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}
.score.d{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
svg.sp{width:84px;height:26px;flex:none}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
.more{display:block;margin:10px auto 0;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 18px;font:inherit}
.star{border:0;background:none;font-size:20px;line-height:1;color:var(--sub);cursor:pointer;padding:4px}
.star.on{color:#f2b01e}
/* 詳細 */
dialog{border:0;padding:0;margin:0;width:100%;max-width:760px;height:100%;max-height:100%;background:var(--bg);color:var(--ink)}
@media (min-width:780px){dialog{margin:auto;height:auto;max-height:92vh;border-radius:16px;border:1px solid var(--line)}}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);z-index:2}
.dh h2{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:var(--chip);color:var(--ink);border-radius:999px;width:36px;height:36px;font-size:18px;cursor:pointer}
.db{padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
.big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
@media (min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
.kv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kv span{display:block;font-size:11.5px;color:var(--sub)}
.kv b{font-variant-numeric:tabular-nums;font-size:15px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;margin:6px 0}
.seg button{border:0;background:none;color:var(--sub);border-radius:8px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 6px 4px}
.chart svg{width:100%;height:auto;display:block}
.reasons{margin:12px 0;padding-left:18px}
.reasons li{margin:3px 0}
a.ext{color:var(--accent)}
/* クラフト */
.settings{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.settings summary{padding:9px 12px;cursor:pointer;font-size:14px;font-weight:600;list-style:none}
.settings summary::-webkit-details-marker{display:none}
.settings summary::before{content:"⚙ ";color:var(--sub)}
.settings summary span{font-weight:400;font-size:12px;color:var(--sub);margin-left:4px}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 12px}
@media (max-width:420px){.setgrid{grid-template-columns:1fr}}
.setgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)}
.setgrid label.chk{flex-direction:row;align-items:center;gap:8px;grid-column:1/-1;font-size:13px;color:var(--ink)}
.setgrid input[type=number]{width:5.5em}
.inl{display:flex;align-items:center;gap:6px;color:var(--ink)}
.chk input{width:20px;height:20px;margin:0}
.profit{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.flow{font-size:12.5px;color:var(--sub);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
table.mats{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mats th,.mats td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.mats th{font-size:11.5px;color:var(--sub);font-weight:600;background:var(--chip);white-space:nowrap}
.mats th:first-child,.mats td:first-child{text-align:left}
.mats tr:last-child td{border-bottom:0}
.mats tfoot td{font-weight:700}
.mats .src{display:block;font-size:11px;color:var(--sub);font-weight:400}
.mats .src.self{color:var(--accent)}
.mats .miss{color:var(--warn)}
.linkish{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.h3{font-size:14px;font-weight:700;margin:16px 0 6px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--sub);padding:4px 8px 6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
footer{font-size:12px;color:var(--sub);text-align:center;padding:16px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>AION2 相場ウォッチ</h1>
    <select id="server" aria-label="サーバー"></select>
  </div>
  <div class="meta" id="meta">読み込み中…</div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="up">📈 上がりそう</button>
    <button role="tab" data-tab="down">📉 下がりそう</button>
    <button role="tab" data-tab="move">⚡ 24h変動</button>
    <button role="tab" data-tab="craft">🔨 クラフト利益</button>
    <button role="tab" data-tab="kr">🇰🇷 韓国比較</button>
    <button role="tab" data-tab="all">🔎 検索</button>
    <button role="tab" data-tab="fav">★ お気に入り</button>
  </nav>
</header>
<main>
  <div id="note"></div>
  <div class="tools" id="tools" hidden>
    <input id="q" type="search" placeholder="アイテム名で検索" autocomplete="off">
    <select id="cat" aria-label="カテゴリ"><option value="">すべてのカテゴリ</option></select>
    <select id="sort" aria-label="並び順">
      <option value="sc">上がりそう順</option><option value="-sc">下がりそう順</option>
      <option value="ch24">24h上昇率</option><option value="-ch24">24h下落率</option>
      <option value="ch7">7日上昇率</option><option value="us">よく売れる順</option>
      <option value="p">価格が高い順</option>
    </select>
  </div>
  <div id="ctools" hidden>
    <div class="tools">
      <input id="cq" type="search" placeholder="製品・素材の名前で検索" autocomplete="off">
      <select id="ccat" aria-label="系統">
        <option value="">すべての系統</option>
        <option value="Blacksmithing">鍛冶</option><option value="Tailoring">裁縫</option>
        <option value="Jewelcrafting">細工</option><option value="Alchemy">錬金</option><option value="Cooking">料理</option>
      </select>
      <select id="csort" aria-label="並び順">
        <option value="margin">利益率が高い順</option>
        <option value="profit">1回あたり利益が多い順</option>
        <option value="volume">売れ筋順（利益×24h販売数）</option>
      </select>
    </div>
    <details class="settings" id="cset">
      <summary>計算の設定 <span id="csetsum"></span></summary>
      <div class="setgrid">
        <label>成功率
          <span class="inl"><input id="csucc" type="number" min="1" max="100" step="1" inputmode="numeric">%</span>
        </label>
        <label>価格の基準
          <select id="cbasis"><option value="now">現在の最安出品</option><option value="med">7日の中央値（安定）</option></select>
        </label>
        <label>素材の調達
          <select id="cmode"><option value="best">購入か自作の安い方</option><option value="buy">すべて購入</option></select>
        </label>
        <label class="chk"><input id="cmiss" type="checkbox"> 価格不明の素材がある品も表示</label>
      </div>
    </details>
  </div>
  <div class="list" id="list"></div>
  <button class="more" id="more" hidden>もっと見る</button>
</main>
<footer>
  データ元：<a class="ext" href="https://aion2.exchange" target="_blank" rel="noopener">aion2.exchange</a>（非公式・最安出品価格）／日本語名：NC公式サイト／レシピ：<a class="ext" href="https://github.com/dimkk/aion2-market-stack" target="_blank" rel="noopener">aion2-market-stack</a>（Apache-2.0）。<br>
  予測は過去の値動きと出品数からの目安で、利益を保証するものではありません。NCSOFTとは無関係です。
</footer>

<dialog id="dlg">
  <div class="dh"><button class="star" id="dstar" aria-label="お気に入り">☆</button><h2 id="dtitle"></h2><button class="x" id="dclose" aria-label="閉じる">✕</button></div>
  <div class="db" id="dbody"></div>
</dialog>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const st = { idx: null, sum: null, names: {}, tab: "up", limit: 40, server: null, range: 7 };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let favs = new Set(store.get("favs", []));

const FACTION = { Elyos: "天族", Asmodian: "魔族" };
const yen = (n) => n == null ? "—" : Math.round(n).toLocaleString("ja-JP");
const compact = (n) => {
  if (n == null) return "—";
  if (n >= 1e8) return (n / 1e8).toFixed(n >= 1e9 ? 1 : 2).replace(/\.?0+$/, "") + "億";
  if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e6 ? 0 : 1).replace(/\.0$/, "") + "万";
  return yen(n);
};
const pct = (x, d = 1) => x == null ? "—" : (x > 0 ? "+" : x < 0 ? "−" : "±") + Math.abs(x * 100).toFixed(d) + "%";
const cls = (x) => x == null || Math.abs(x) < 0.005 ? "flat" : x > 0 ? "up" : "down";
const arrow = (x) => x == null || Math.abs(x) < 0.005 ? "" : x > 0 ? "▲" : "▼";
const nm = (it) => (st.names[it.k] && st.names[it.k][0]) || it.en || ("#" + it.k);
const ago = (iso) => {
  if (!iso) return "—";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "たった今" : m < 60 ? m + "分前" : m < 1440 ? Math.floor(m / 60) + "時間前" : Math.floor(m / 1440) + "日前";
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

async function getJSON(path) {
  const r = await fetch(path + (path.includes("?") ? "&" : "?") + "t=" + Math.floor(Date.now() / 300000), { cache: "no-cache" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}

function sparkSVG(sp, w = 84, h = 26) {
  const v = (sp || []).filter((x) => x != null);
  if (v.length < 2) return "";
  const mn = Math.min(...v), mx = Math.max(...v), rng = mx - mn || 1;
  const pts = [];
  sp.forEach((x, i) => { if (x != null) pts.push([(i / (sp.length - 1)) * (w - 2) + 1, h - 2 - ((x - mn) / rng) * (h - 4)]); });
  const c = v[v.length - 1] >= v[0] ? "var(--up)" : "var(--down)";
  return `<svg class="sp" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round" points="${pts.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" ")}"/></svg>`;
}

function card(it) {
  const sc = it.sc;
  const badge = sc == null || Math.abs(sc) < st.sum.thresh ? "" :
    `<span class="score ${sc > 0 ? "u" : "d"}">${sc > 0 ? "上がりそう" : "下がりそう"} ${Math.round(Math.abs(sc) * 100)}</span>`;
  const chips = (it.tags || []).map((t) => `<span class="chip ${/上昇|減少|割安/.test(t) ? "u" : /下落|増加|割高/.test(t) ? "d" : ""}">${esc(t)}</span>`).join("");
  return `<button class="card" data-k="${it.k}">
    <div class="name">${favs.has(it.k) ? "★ " : ""}${esc(nm(it))}</div>
    <div class="price">${compact(it.p)}</div>
    <div class="cat">${esc(it.cat || "")}${it.l != null ? "・出品" + it.l : ""}${it.us ? "・24h販売" + it.us : ""}</div>
    <div class="chg ${cls(it.ch24)}">${arrow(it.ch24)}${pct(it.ch24)} <span class="flat">24h</span></div>
    <div class="row3">${badge}<span class="why">${esc((it.why || [])[0] || "")}</span>${sparkSVG(it.sp)}</div>
    ${chips ? `<div class="chips">${chips}</div>` : ""}
  </button>`;
}

function rows() {
  const items = st.sum.items, th = st.sum.thresh;
  const has = (it) => it.p != null && it.p > 0;
  switch (st.tab) {
    case "up": return items.filter((i) => has(i) && i.sc >= th).sort((a, b) => b.sc - a.sc);
    case "down": return items.filter((i) => has(i) && i.sc <= -th).sort((a, b) => a.sc - b.sc);
    case "move": return items.filter((i) => has(i) && i.ch24 != null && (i.l ?? 0) >= 2).sort((a, b) => Math.abs(b.ch24) - Math.abs(a.ch24));
    case "fav": return items.filter((i) => favs.has(i.k));
    default: {
      const q = $("#q").value.trim().toLowerCase(), c = $("#cat").value, s = $("#sort").value;
      const neg = s.startsWith("-"), key = s.replace("-", "");
      return items.filter((i) => has(i) && (!c || i.cat === c) && (!q || nm(i).toLowerCase().includes(q) || (i.en || "").toLowerCase().includes(q)))
        .sort((a, b) => {
          const av = a[key] ?? (neg ? Infinity : -Infinity), bv = b[key] ?? (neg ? Infinity : -Infinity);
          return neg ? av - bv : bv - av;
        });
    }
  }
}

const NOTES = {
  up: "直近の<b>上昇トレンド</b>・<b>出品数の減少</b>・<b>7日相場より割安</b>を組み合わせた点数が高い順です。数字は確信度（0〜100）。",
  down: "直近の<b>下落トレンド</b>・<b>出品数の増加</b>・<b>7日相場より割高</b>を組み合わせた点数が高い順。持っているなら売り時の候補です。",
  move: "この24時間で値動きが大きかった順（出品2件以上）。",
  all: "",
  fav: "☆を押したアイテムがここに並びます（この端末に保存）。",
};

function render() {
  if (!st.sum) return;
  $("#tools").hidden = st.tab !== "all";
  $("#ctools").hidden = st.tab !== "craft";
  if (st.tab === "craft") return renderCraft();
  if (st.tab === "kr") return renderKR();
  const bt = st.sum.backtest || {};
  let note = NOTES[st.tab] || "";
  if ((st.tab === "up" || st.tab === "down") && bt.hit_rate != null) {
    note += `<br>過去${Math.round(bt.n).toLocaleString()}回の判定で、24時間後に予想どおりの向きへ動いた割合 <b>${Math.round(bt.hit_rate * 100)}%</b>（50%なら当てずっぽうと同じ）。`;
  }
  $("#note").innerHTML = note ? `<div class="note">${note}</div>` : "";
  const r = rows();
  $("#list").innerHTML = r.length ? r.slice(0, st.limit).map(card).join("") :
    `<div class="empty">${st.tab === "fav" ? "まだお気に入りがありません" : "該当するアイテムがありません"}</div>`;
  $("#more").hidden = r.length <= st.limit;
}

function setTab(t) {
  st.tab = t; st.limit = 40;
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === t));
  store.set("tab", t);
  render();
  window.scrollTo({ top: 0 });
}

async function loadServer(sid) {
  st.server = sid; store.set("server", sid);
  $("#list").innerHTML = `<div class="empty">読み込み中…</div>`;
  try {
    st.sum = await getJSON(`data/s/${sid}/summary.json`);
  } catch (e) {
    $("#list").innerHTML = `<div class="empty">データを読めませんでした（${esc(e.message)}）</div>`;
    return;
  }
  const s = (st.idx.servers || []).find((x) => x.server_id == sid) || {};
  $("#meta").innerHTML = `相場：<b>${ago(st.sum.captured_at)}</b><span>・${st.sum.items.length}品目</span>${s.stale ? '<span class="stale">・取得失敗のため前回データ</span>' : ""}`;
  const cats = [...new Set(st.sum.items.map((i) => i.cat).filter(Boolean))].sort();
  $("#cat").innerHTML = `<option value="">すべてのカテゴリ</option>` + cats.map((c) => `<option>${esc(c)}</option>`).join("");
  render();
}

// ── クラフト利益 ──
const CAT = { Blacksmithing: "鍛冶", Tailoring: "裁縫", Jewelcrafting: "細工", Alchemy: "錬金", Cooking: "料理" };
const SUB = { Weapon: "武器", Armor: "防具", Accessory: "アクセサリー", Usable: "消耗品", Misc: "その他" };
const FEE = 0.08; // 取引所の販売手数料
const cs = Object.assign({ succ: 95, basis: "now", mode: "best", miss: false, custom: {} }, store.get("craft", {}));
let craftCache = null;

const nmId = (id) => (st.names[id] && st.names[id][0]) || (st.recipes && st.recipes.names[id]) || ("#" + id);
const sign = (n) => (n >= 0 ? "+" : "−") + compact(Math.abs(n));

function factionLetter() {
  const s = (st.idx.servers || []).find((x) => x.server_id == st.server) || {};
  return s.faction === "Asmodian" ? "D" : "L";
}

/** 現在のサーバー・設定で全レシピの原価と利益を計算する。 */
function craftRows() {
  const key = [st.server, cs.succ, cs.basis, cs.mode, JSON.stringify(cs.custom || {})].join("|");
  if (craftCache && craftCache.key === key && craftCache.sum === st.sum) return craftCache.rows;
  const R = st.recipes;
  if (!R) return [];
  const fac = factionLetter();
  const byItem = new Map(st.sum.items.map((i) => [i.k, i]));
  const price = (id) => {
    const it = byItem.get(id);
    if (!it || !(it.p > 0)) {
      const v = +(cs.custom || {})[id];
      return v > 0 ? v : null; // 取引所に無い素材は自分で入れた価格（NPC販売品など）
    }
    if (cs.basis === "med" && it.med7 > 0) return it.med7;
    // 1件だけの極端に高い出品で利益が水増しされないよう、7日中央値の2.5倍を上限にする
    return it.med7 > 0 && it.p > it.med7 * 2.5 ? it.med7 : it.p;
  };
  const s = Math.min(1, Math.max(0.01, (+cs.succ || 100) / 100));
  const recs = R.r.filter((r) => r[3] === fac || r[3] === "A");
  const producers = new Map();
  for (const r of recs) { const a = producers.get(r[8]) || []; a.push(r); producers.set(r[8], a); }

  // 素材1個の調達コスト：買う／作る（さらに下の素材も同じ判断）の安い方。循環は辿らない
  const memo = new Map();
  function unit(id, stack) {
    if (!stack.size && memo.has(id)) return memo.get(id);
    const buy = price(id);
    let best = buy == null ? null : { cost: buy, how: "buy" };
    if (cs.mode === "best" && !stack.has(id) && stack.size < 6) {
      stack.add(id);
      for (const r of producers.get(id) || []) {
        let c = 0, ok = true;
        for (const [m, q] of r[10]) { const u = unit(m, stack); if (!u) { ok = false; break; } c += q * u.cost; }
        if (!ok) continue;
        const per = c / (s * r[9]);
        if (!best || per < best.cost - 0.5) best = { cost: per, how: "craft", rid: r[0] };
      }
      stack.delete(id);
    }
    if (!stack.size) memo.set(id, best);
    return best;
  }

  const rows = [];
  for (const r of recs) {
    const [rid, cat, sub, , lvl, learn, combo, comboOut, out, q, mats, kind] = r;
    const P = price(out);
    if (P == null) continue; // 取引所に出ていない製品は売値が分からない
    const c = comboOut != null ? combo : 0;
    const Pc = comboOut != null ? (price(comboOut) ?? P) : P;
    let cost = 0, miss = 0, self = 0;
    const lines = mats.map(([m, n]) => {
      const u = unit(m, new Set());
      if (!u) { miss++; return { id: m, n, u: null }; }
      cost += n * u.cost;
      if (u.how === "craft") self++;
      return { id: m, n, u };
    });
    const rev = s * q * ((1 - c) * P + c * Pc) * (1 - FEE);
    const profit = rev - cost;
    const it = byItem.get(out);
    rows.push({
      rid, cat, sub, lvl, learn, kind, combo: c, comboOut, comboPriced: comboOut != null && price(comboOut) != null,
      out, q, P, Pc, cost, rev, profit, margin: cost > 0 ? profit / cost : null,
      miss, self, lines, us: (it && it.us) || 0, s,
    });
  }
  craftCache = { key, sum: st.sum, rows };
  return rows;
}

function craftCard(x) {
  const chips = [];
  if (x.combo) chips.push(`<span class="chip u">コンボ${Math.round(x.combo * 100)}%</span>`);
  if (x.self) chips.push(`<span class="chip">素材${x.self}種を自作</span>`);
  if (x.miss) chips.push(`<span class="chip d">価格不明の素材${x.miss}種</span>`);
  if (x.kind === "S") chips.push(`<span class="chip">継承</span>`);
  return `<button class="card" data-r="${x.rid}">
    <div class="name">${esc(nmId(x.out))}${x.q > 1 ? ` ×${x.q}` : ""}</div>
    <div class="profit ${cls(x.profit)}">${sign(x.profit)}${x.miss ? "※" : ""}</div>
    <div class="cat">${CAT[x.cat] || esc(x.cat)}・${SUB[x.sub] || esc(x.sub)}${x.lvl ? "・熟練" + x.lvl : ""}${x.us ? "・24h販売" + x.us : ""}</div>
    <div class="chg ${cls(x.margin)}">利益率 ${pct(x.margin, 0)}</div>
    <div class="row3"><span class="flow">素材 ${compact(x.cost)} → 売上 ${compact(x.rev)}（成功率・手数料込み）</span></div>
    ${chips.length ? `<div class="chips">${chips.join("")}</div>` : ""}
  </button>`;
}

function renderCraft() {
  const B = { now: "現在の最安", med: "7日中央値" }, M = { best: "安い方で調達", buy: "すべて購入" };
  $("#csetsum").textContent = `成功率${cs.succ}%・${B[cs.basis]}・${M[cs.mode]}`;
  if (!st.recipes) {
    $("#note").innerHTML = "";
    $("#list").innerHTML = `<div class="empty">レシピデータを読めませんでした</div>`;
    $("#more").hidden = true;
    return;
  }
  const all = craftRows();
  const q = $("#cq").value.trim().toLowerCase(), cat = $("#ccat").value, sort = $("#csort").value;
  const hit = (x) => !q || [x.out, ...x.lines.map((l) => l.id)].some((id) => nmId(id).toLowerCase().includes(q) || String(st.recipes.names[id] || "").toLowerCase().includes(q));
  const key = sort === "profit" ? (x) => x.profit : sort === "volume" ? (x) => (x.profit > 0 ? x.profit * x.us : x.profit) : (x) => x.margin ?? -Infinity;
  const r = all.filter((x) => (cs.miss || !x.miss) && (!cat || x.cat === cat) && hit(x)).sort((a, b) => key(b) - key(a));
  const pos = all.filter((x) => !x.miss && x.profit > 0).length;
  const hidden = cs.miss ? 0 : all.filter((x) => x.miss).length;
  $("#note").innerHTML = `<div class="note">1回クラフトしたときの<b>期待売上（成功率・コンボ・手数料8%込み）−素材費</b>です。素材は取引所の価格で計算し、自作の方が安い素材は自作コストを使います。<br>
    売値が分かる${all.length}件のうち、黒字は<b>${pos}件</b>。${hidden ? `NPC販売品など価格が分からない素材を使う${hidden}件は非表示です（⚙設定で表示し、内訳画面で単価を入れると計算できます）。` : "※は価格不明の素材を0として計算した参考値です。"}</div>`;
  $("#list").innerHTML = r.length ? r.slice(0, st.limit).map(craftCard).join("") : `<div class="empty">該当するレシピがありません</div>`;
  $("#more").hidden = r.length <= st.limit;
}

function openCraft(rid) {
  const x = craftRows().find((y) => y.rid == rid);
  if (!x) return;
  const byItem = new Map(st.sum.items.map((i) => [i.k, i]));
  $("#dstar").hidden = true;
  $("#dtitle").textContent = nmId(x.out) + (x.q > 1 ? ` ×${x.q}` : "");
  const nameCell = (id) => byItem.has(id)
    ? `<button class="linkish" data-item="${id}">${esc(nmId(id))}</button>` : esc(nmId(id));
  const custom = cs.custom || {};
  const lines = x.lines.map((l) => {
    const u = l.u;
    const mine = !byItem.has(l.id) && custom[l.id] > 0;
    const src = !u ? `<span class="src miss">取引所に無い：単価を入力 →</span>`
      : u.how === "craft" ? `<button class="linkish src self" data-r="${u.rid}">自作の方が安い（内訳 ›）</button>`
      : mine ? `<span class="src">自分で入力した価格</span>` : `<span class="src">購入</span>`;
    const unitCell = (!u || mine)
      ? `<input class="cprice" type="number" min="0" inputmode="numeric" data-id="${l.id}" value="${mine ? custom[l.id] : ""}" placeholder="単価" aria-label="${esc(nmId(l.id))}の単価" style="width:6.5em;min-height:32px;padding:4px 6px">`
      : yen(u.cost);
    return `<tr><td>${nameCell(l.id)}${src}</td><td>${l.n.toLocaleString()}</td><td>${unitCell}</td><td>${u ? yen(u.cost * l.n) : "—"}</td></tr>`;
  }).join("");
  const comboTxt = x.combo
    ? `${Math.round(x.combo * 100)}%で「${esc(nmId(x.comboOut))}」になる（${x.comboPriced ? "相場 " + yen(x.Pc) : "相場不明のため通常品の価格で計算"}）` : "なし";

    <div class="cat">${CAT[x.cat] || esc(x.cat)}・${SUB[x.sub] || esc(x.sub)}${x.lvl ? "・必要熟練度 " + x.lvl : ""}${x.kind === "S" ? "・継承レシピ" : ""}</div>
    <div class="big ${cls(x.profit)}">${sign(x.profit)}<span style="font-size:15px" class="flat"> /1回</span></div>
    <div><span class="score ${x.profit >= 0 ? "u" : "d"}">利益率 ${pct(x.margin, 1)}</span></div>
    ${x.miss ? `<div class="note" style="margin-top:10px">価格が分からない素材が${x.miss}種あり、その分を0として計算しています。実際の利益はこれより少なくなります。</div>` : ""}
    <div class="grid">
      <div class="kv"><span>素材費（1回）</span><b>${yen(x.cost)}</b></div>
      <div class="kv"><span>期待売上（手数料後）</span><b>${yen(x.rev)}</b></div>
      <div class="kv"><span>製品の相場</span><b>${yen(x.P)}</b></div>
      <div class="kv"><span>製品の24h販売数</span><b>${x.us || "—"}</b></div>
    </div>
    <div class="h3">必要な素材</div>
    <table class="mats">
      <thead><tr><th>素材</th><th>個数</th><th>単価</th><th>小計</th></tr></thead>
      <tbody>${lines}</tbody>
      <tfoot><tr><td>合計</td><td></td><td></td><td>${yen(x.cost)}</td></tr></tfoot>
    </table>
    <div class="h3">計算の内訳</div>
    <ul class="reasons">
      <li>成功率 ${Math.round(x.s * 100)}%（設定で変更できます）</li>
      <li>コンボ：${comboTxt}</li>
      <li>期待売上 = 成功率 × ${x.q}個 × 相場 × (1 − 手数料8%) = ${yen(x.rev)}</li>
      <li>利益 = ${yen(x.rev)} − 素材費 ${yen(x.cost)} = ${sign(x.profit)}</li>
    </ul>
    <div class="btnrow">${byItem.has(x.out) ? `<button class="btn" data-item="${x.out}">製品の相場チャートを見る</button>` : ""}</div>`;
  $("#dbody").dataset.rid = x.rid;
  $("#dbody").scrollTop = 0;
  if (!$("#dlg").open) $("#dlg").showModal();
}

// 取引所に無い素材（NPC販売品・ドロップ品）の単価を入力 → 保存して計算し直す
$("#dbody").addEventListener("change", (e) => {
  const inp = e.target.closest("input.cprice");
  if (!inp) return;
  const v = Math.round(+inp.value);
  cs.custom = Object.assign({}, cs.custom);
  if (v > 0) cs.custom[inp.dataset.id] = v; else delete cs.custom[inp.dataset.id];
  store.set("craft", cs);
  const rid = $("#dbody").dataset.rid;
  render();
  if (rid) openCraft(+rid);
});

$("#dbody").addEventListener("click", (e) => {
  const b = e.target.closest("[data-item],[data-r],[data-kr]");
  if (!b || !$("#dbody").contains(b)) return;
  if (b.dataset.r) openCraft(+b.dataset.r);
  else if (b.dataset.kr) openKR(+b.dataset.kr);
  else if (b.dataset.item) openItem(+b.dataset.item);
});

// ── 韓国比較 ──
const DIR = {
  up: ["上がりそう", "u"], down: ["下がりそう", "d"], peak: ["天井圏・売り時", "d"], flat: ["横ばい", ""],
};
const WEEK = 7 * 864e5;
const glWeekNow = () => st.kr ? (Date.now() - new Date(st.kr.launch.GL + "T00:00:00Z")) / WEEK : 0;

/** グローバル版の現在値：自分のサーバーの最新値（無ければ北米・欧州の参考値）。 */
function krNow(x) {
  const it = st.sum && st.sum.items.find((i) => i.k == x.key);
  if (it && it.p > 0) return { v: it.p, label: "このサーバー" };
  const g = x.gl_naeu[x.gl_naeu.length - 1];
  return g ? { v: g[1], label: "北米・欧州（" + st.kr.global_snapshot.slice(5, 10).replace("-", "/") + "）" } : null;
}
function krEarly(x) {
  const v = x.krq.filter((p) => p[0] <= 12 && p[1]).map((p) => p[1]);
  return v.length ? [Math.min(...v), Math.max(...v)] : null;
}
function krLate(x) {
  const v = x.krw.map((p) => p[1]).concat(x.krq.filter((p) => p[0] > 12).map((p) => p[1]));
  return v.length ? [Math.min(...v), Math.max(...v)] : null;
}
const rng = (r) => !r ? "—" : r[0] === r[1] ? compact(r[0]) : compact(r[0]) + "〜" + compact(r[1]);
const krName = (x) => (st.names[x.key] && st.names[x.key][0]) || x.ja;

function krCard(x) {
  const f = x.fc || {}, d = DIR[f.dir] || ["—", ""], now = krNow(x);
  return `<button class="card" data-krcard="${x.key}">
    <div class="name">${esc(krName(x))}</div>
    <div class="price">${now ? compact(now.v) : "—"}</div>
    <div class="cat">${esc(x.kr)}</div>
    <div class="chg flat">${now ? esc(now.label) : ""}</div>
    <div class="row3"><span class="score ${d[1]}" style="${d[1] ? "" : "background:var(--chip);color:var(--sub)"}">${d[0]}</span><span class="why">${esc(f.head || "")}</span></div>
    <div class="chips"><span class="chip">韓国1〜12週目 ${rng(krEarly(x))}</span><span class="chip">韓国18週目〜 ${rng(krLate(x))}</span><span class="chip">${esc(f.when || "")}</span><span class="chip">確度 ${esc(f.conf || "—")}</span></div>
  </button>`;
}

function renderKR() {
  $("#more").hidden = true;
  if (!st.kr) { $("#note").innerHTML = ""; $("#list").innerHTML = `<div class="empty">韓国版のデータを読めませんでした</div>`; return; }
  const k = st.kr, w = glWeekNow();
  $("#note").innerHTML = `<div class="note">
    グローバル版は発売から<b>${w.toFixed(1)}週目</b>。韓国版の同じ時期以降の相場と、韓国で起きた出来事を当てはめた見立てです（${k.forecast_date.replace(/-/g, "/")}時点）。
    根拠に書いたグローバル版の価格は北米・欧州6サーバーの10/19時点の値で、このサーバーの値とは違うことがあります。
    <details style="margin-top:6px"><summary style="cursor:pointer;color:var(--ink);font-weight:600">全体の見通しを読む</summary>
    <ul class="reasons">${k.outlook.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
    <div class="h3">韓国版の主な出来事</div><ul class="reasons">${k.events.KR.map((e) => `<li>${e[0].toFixed(0)}週目（${e[1]}）：${esc(e[2])}</li>`).join("")}</ul>
    <div class="h3">グローバル版の出来事・予定</div><ul class="reasons">${k.events.GL.map((e) => `<li>${e[0].toFixed(1)}週目（${e[1]}）：${esc(e[2])}</li>`).join("")}</ul>
    </details></div>`;
  const order = { peak: 0, up: 1, down: 2, flat: 3 }, conf = { 高: 0, 中: 1, 低: 2 };
  const rows = [...k.items].sort((a, b) => (order[a.fc?.dir] ?? 9) - (order[b.fc?.dir] ?? 9) || (conf[a.fc?.conf] ?? 9) - (conf[b.fc?.conf] ?? 9));
  $("#list").innerHTML = rows.map(krCard).join("");
}

function krChartSVG(x, live) {
  const W = 380, H = 240, padL = 46, padR = 8, padT = 12, padB = 30;
  const series = [];
  if (x.krw.length) series.push({ pts: x.krw, color: "var(--warn)", w: 2 });
  if (x.gl_naeu.length) series.push({ pts: x.gl_naeu, color: "var(--sub)", w: 1.6, dash: "4 3" });
  if (live && live.length) series.push({ pts: live, color: "var(--accent)", w: 2.2 });
  const dots = x.krq.filter((p) => p[1]).map((p) => [p[0], p[1]]);
  const all = series.flatMap((s) => s.pts).concat(dots).filter((p) => p[1] > 0);
  if (all.length < 2) return `<div class="empty">比較できるデータがありません</div>`;
  const xmax = Math.max(48, ...all.map((p) => p[0])) + 1;
  let lo = Math.log10(Math.min(...all.map((p) => p[1]))), hi = Math.log10(Math.max(...all.map((p) => p[1])));
  if (hi - lo < 0.3) { lo -= 0.15; hi += 0.15; }
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  const X = (w) => padL + (w / xmax) * (W - padL - padR);
  const Y = (v) => padT + (1 - (Math.log10(v) - lo) / (hi - lo)) * (H - padT - padB);
  const path = (pts) => pts.filter((p) => p[1] > 0).map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join("");
  const ticks = [];
  for (let e = Math.floor(lo); e <= Math.ceil(hi); e++) for (const m of [1, 2, 5]) { const v = m * 10 ** e; if (Math.log10(v) >= lo && Math.log10(v) <= hi) ticks.push(v); }
  const yt = ticks.length > 6 ? ticks.filter((_, i) => i % 2 === 0) : ticks;
  const now = glWeekNow();
  const ev = st.kr.events.KR.map((e, i) => `<line x1="${X(e[0])}" x2="${X(e[0])}" y1="${padT}" y2="${H - padB}" stroke="var(--warn)" stroke-opacity=".35" stroke-dasharray="2 3"/><text x="${X(e[0])}" y="${padT + 9}" font-size="9" fill="var(--warn)" text-anchor="middle">${i + 1}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="発売からの週数で見た韓国版とグローバル版の価格">
    ${yt.map((v) => `<line x1="${padL}" x2="${W - padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${padL - 5}" y="${Y(v) + 4}" font-size="11" fill="var(--sub)" text-anchor="end">${compact(v)}</text>`).join("")}
    ${[0, 12, 24, 36, 48].filter((w) => w < xmax).map((w) => `<text x="${X(w)}" y="${H - 12}" font-size="11" fill="var(--sub)" text-anchor="middle">${w}週</text>`).join("")}
    ${ev}
    <line x1="${X(now)}" x2="${X(now)}" y1="${padT}" y2="${H - padB}" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="${X(now) + 3}" y="${H - padB - 4}" font-size="10" fill="var(--accent)">今</text>
    ${series.map((s) => `<path d="${path(s.pts)}" fill="none" stroke="${s.color}" stroke-width="${s.w}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""} stroke-linejoin="round"/>`).join("")}
    ${dots.map((p) => `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.6" fill="var(--panel)" stroke="var(--warn)" stroke-width="2"/>`).join("")}
  </svg>
  <div class="legend"><span><i style="background:var(--accent)"></i>このサーバー</span><span><i style="background:var(--sub)"></i>北米・欧州</span><span><i style="background:var(--warn)"></i>韓国（線＝週平均・○＝掲示板の価格）</span><span>縦点線の番号＝韓国の出来事</span></div>`;
}

    <div class="chart" id="krchart"><div class="empty">読み込み中…</div></div>
    <div class="grid">
      <div class="kv"><span>韓国 1〜12週目</span><b>${rng(krEarly(x))}</b></div>
      <div class="kv"><span>韓国 18週目以降</span><b>${rng(krLate(x))}</b></div>
      <div class="kv"><span>韓国の最新（${x.krw.length ? x.krw[x.krw.length - 1][0].toFixed(0) + "週目" : "—"}）</span><b>${x.krw.length ? compact(x.krw[x.krw.length - 1][1]) : "—"}</b></div>
      <div class="kv"><span>グローバルの週数</span><b>${glWeekNow().toFixed(1)}週目</b></div>
    </div>
    ${x.krq.length ? `<div class="h3">韓国の掲示板に残っている価格</div><ul class="reasons">${x.krq.map((p) => `<li>${p[0].toFixed(0)}週目：${p[1] ? compact(p[1]) : "—"}（${esc(p[3])}）<a class="ext" href="${esc(p[2])}" target="_blank" rel="noopener">出典</a></li>`).join("")}</ul>` : ""}
    <div class="h3">韓国版の出来事（グラフの番号）</div>
    <ol class="reasons">${st.kr.events.KR.map((e) => `<li>${e[0].toFixed(0)}週目：${esc(e[2])}</li>`).join("")}</ol>
    <p class="cat" style="white-space:normal">韓国の週平均は aeid.gg、掲示板の価格は DCInside・Inven の書き込み（shizukaziye/aion2-market-history の書き起こし）。予測は過去の似た状況からの見立てで、外れることがあります。</p>
    ${inSum ? `<div class="btnrow"><button class="btn" data-item="${key}">このサーバーの相場チャートを見る</button></div>` : ""}`;
  $("#dbody").scrollTop = 0;
  if (!$("#dlg").open) $("#dlg").showModal();
  let live = [];
  if (inSum) {
    try {
      const h = await getJSON(`data/s/${st.server}/i/${key}.json`);
      const t0 = new Date(st.kr.launch.GL + "T00:00:00Z").getTime(), byDay = new Map();
      h.p.forEach((v, i) => {
        if (v == null) return;
        const w = ((h.h0 + i) * 3600e3 - t0) / WEEK;
        if (w < -1) return;
        const dkey = Math.floor(w * 7);
        (byDay.get(dkey) || byDay.set(dkey, []).get(dkey)).push(v);
      });
      live = [...byDay.entries()].sort((a, b) => a[0] - b[0]).map(([dd, v]) => { v.sort((a, b) => a - b); return [dd / 7, v[v.length >> 1]]; });
    } catch {}
  }
  const c = $("#krchart");
  if (c) c.innerHTML = krChartSVG(x, live);
}

// ── 詳細 ──
function chartSVG(p, l, h0) {
  const n = Math.min(p.length, st.range * 24), P = p.slice(-n), L = (l || []).slice(-n);
  const W = 380, H = 230, padL = 46, padR = 6, padT = 10, padB = 58, LH = 34;
  const v = P.filter((x) => x != null);
  if (v.length < 2) return `<div class="empty">履歴がまだ足りません</div>`;
  let mn = Math.min(...v), mx = Math.max(...v);
  const pad = (mx - mn) * 0.08 || mx * 0.05; mn -= pad; mx += pad;
  const x = (i) => padL + (i / (n - 1)) * (W - padL - padR);
  const y = (val) => padT + (1 - (val - mn) / (mx - mn)) * (H - padT - padB);
  let d = "", pen = false;
  P.forEach((val, i) => { if (val == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(val).toFixed(1); pen = true; });
  const ticks = [0, 0.5, 1].map((t) => mn + (mx - mn) * t);
  const lmax = Math.max(1, ...L.filter((q) => q != null));
  const bw = Math.max(1, (W - padL - padR) / n - 0.5);
  const bars = L.map((q, i) => q == null ? "" : `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${(H - 20 - (q / lmax) * LH).toFixed(1)}" width="${bw.toFixed(1)}" height="${((q / lmax) * LH).toFixed(1)}" fill="var(--line)"/>`).join("");
  const start = (h0 + p.length - n) * 3600e3;
  const days = [];
  for (let i = 0; i < n; i++) {
    const t = new Date(start + i * 3600e3);
    if (t.getHours() === 0) days.push(i);
  }
  const step = Math.ceil(days.length / 7) || 1;
  const dl = days.filter((_, j) => j % step === 0).map((i) => {
    const t = new Date(start + i * 3600e3);
    return `<line x1="${x(i)}" x2="${x(i)}" y1="${padT}" y2="${H - 20}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${x(i)}" y="${H - 4}" font-size="12" fill="var(--sub)" text-anchor="middle">${t.getMonth() + 1}/${t.getDate()}</text>`;
  }).join("");
  const c = v[v.length - 1] >= v[0] ? "var(--up)" : "var(--down)";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="価格の推移">
    ${dl}${bars}
    ${ticks.map((t) => `<text x="${padL - 6}" y="${y(t) + 4}" font-size="12" fill="var(--sub)" text-anchor="end">${compact(t)}</text>`).join("")}
    <path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>
    <text x="${W - padR}" y="${H - 22 - LH}" font-size="11" fill="var(--sub)" text-anchor="end">灰色＝出品数</text>
  </svg>`;
}

/** 相場の詳細画面に「このアイテムを作るレシピ／素材に使うレシピ」を出す。 */
function craftLinks(k) {
  if (!st.recipes) return "";
  const rows = craftRows();
  const made = rows.filter((x) => x.out == k);
  const used = rows.filter((x) => x.lines.some((l) => l.id == k)).sort((a, b) => b.profit - a.profit).slice(0, 5);
  const li = (x) => `<li><button class="linkish" data-r="${x.rid}">${esc(nmId(x.out))}</button> <span class="${cls(x.profit)}">${sign(x.profit)}</span></li>`;
  let h = "";
  if (made.length) h += `<div class="h3">このアイテムを作るレシピ（1回あたり利益）</div><ul class="reasons">${made.map(li).join("")}</ul>`;
  if (used.length) h += `<div class="h3">素材に使うレシピ（利益が多い順）</div><ul class="reasons">${used.map(li).join("")}</ul>`;
  return h;
}

async function openItem(k) {
  const it = st.sum.items.find((i) => i.k == k);
  if (!it) return;
  $("#dtitle").textContent = nm(it);
  const star = $("#dstar");
  star.hidden = false;
  delete $("#dbody").dataset.rid;
  const paint = () => { star.textContent = favs.has(it.k) ? "★" : "☆"; star.classList.toggle("on", favs.has(it.k)); };
  paint();
  star.onclick = () => { favs.has(it.k) ? favs.delete(it.k) : favs.add(it.k); store.set("favs", [...favs]); paint(); render(); };
  const sc = it.sc;
  const verdict = sc == null ? "履歴が少なく判定できません" :
    Math.abs(sc) < st.sum.thresh ? "はっきりした傾向なし" : (sc > 0 ? "上がりそう" : "下がりそう") + `（確信度 ${Math.round(Math.abs(sc) * 100)}）`;
  $("#dbody").innerHTML = `
    <div class="cat">${esc(it.cat || "")}${it.en && st.names[it.k] ? "・" + esc(it.en) : ""}</div>
    <div class="big">${yen(it.p)} <span class="chg ${cls(it.ch24)}" style="font-size:15px">${arrow(it.ch24)}${pct(it.ch24)}</span></div>
    <div><span class="score ${sc > 0 ? "u" : "d"}" style="${sc == null || Math.abs(sc) < st.sum.thresh ? "background:var(--chip);color:var(--sub)" : ""}">${verdict}</span></div>
    ${(it.why || []).length ? `<ul class="reasons">${it.why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
    <div class="seg" role="group" aria-label="期間">${[3, 7, 14, 30].map((d) => `<button data-r="${d}" aria-pressed="${st.range === d}">${d}日</button>`).join("")}</div>
    <div class="chart" id="chart"><div class="empty">読み込み中…</div></div>
    <div class="grid">
      <div class="kv"><span>7日の中央値</span><b>${yen(it.med7)}</b></div>
      <div class="kv"><span>7日変化</span><b class="${cls(it.ch7)}">${pct(it.ch7)}</b></div>
      <div class="kv"><span>出品数</span><b>${it.l ?? "—"}</b></div>
      <div class="kv"><span>24h販売数</span><b>${it.us ?? "—"}</b></div>
      <div class="kv"><span>販売平均価格</span><b>${yen(it.sa)}</b></div>
      <div class="kv"><span>3日トレンド/日</span><b class="${cls(it.slope)}">${pct(it.slope)}</b></div>
      <div class="kv"><span>出品数の増減</span><b class="${cls(it.lt == null ? null : -it.lt)}">${pct(it.lt, 0)}</b></div>
      <div class="kv"><span>手取り（手数料8%）</span><b>${yen(it.p * 0.92)}</b></div>
    </div>
    ${st.kr && st.kr.items.some((x) => x.key == it.k) ? `<div class="btnrow"><button class="btn" data-kr="${it.k}">🇰🇷 韓国版の推移と予測を見る</button></div>` : ""}
    ${craftLinks(it.k)}
    <a class="ext" href="https://aion2.exchange/items/${it.k}" target="_blank" rel="noopener">aion2.exchange で見る ↗</a>`;
  $("#dbody").scrollTop = 0;
  if (!$("#dlg").open) $("#dlg").showModal();
  let detail;
  try { detail = await getJSON(`data/s/${st.server}/i/${it.k}.json`); }
  catch { $("#chart").innerHTML = `<div class="empty">履歴を読めませんでした</div>`; return; }
  const draw = () => { $("#chart").innerHTML = chartSVG(detail.p, detail.l, detail.h0); };
  draw();
  $("#dbody").querySelectorAll(".seg button").forEach((b) => b.onclick = () => {
    st.range = +b.dataset.r; store.set("range", st.range);
    $("#dbody").querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    draw();
  });
}

// ── 起動 ──
async function boot() {
  st.range = store.get("range", 7);
  try {
    [st.idx, st.names, st.recipes] = await Promise.all([
      getJSON("data/index.json"),
      getJSON("data/names.json").catch(() => ({})),
      getJSON("recipes.json").catch(() => null),
    ]);
    st.kr = await getJSON("kr.json").catch(() => null);
  } catch (e) {
    $("#meta").textContent = "まだデータがありません。最初の自動収集が終わるまでお待ちください。";
    $("#list").innerHTML = "";
    return;
  }
  const sv = st.idx.servers || [];
  $("#server").innerHTML = sv.map((s) => `<option value="${s.server_id}">${esc(s.name)}・${FACTION[s.faction] || esc(s.faction || "")}</option>`).join("");
  const saved = store.get("server", null);
  const sid = sv.some((s) => s.server_id == saved) ? saved : sv[0] && sv[0].server_id;
  if (sid == null) { $("#meta").textContent = "対象サーバーがありません"; return; }
  $("#server").value = sid;
  const t = store.get("tab", "up");
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === t));
  st.tab = t;
  await loadServer(sid);
}

$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setTab(b.dataset.tab); });
$("#server").addEventListener("change", (e) => loadServer(e.target.value));
$("#list").addEventListener("click", (e) => {
  const c = e.target.closest(".card");
  if (!c) return;
  if (c.dataset.r) openCraft(+c.dataset.r);
  else if (c.dataset.krcard) openKR(+c.dataset.krcard);
  else openItem(c.dataset.k);
});
$("#csucc").value = cs.succ; $("#cbasis").value = cs.basis; $("#cmode").value = cs.mode; $("#cmiss").checked = !!cs.miss;
const saveCraft = () => {
  const v = Math.round(+$("#csucc").value);
  cs.succ = v >= 1 && v <= 100 ? v : cs.succ;
  cs.basis = $("#cbasis").value; cs.mode = $("#cmode").value; cs.miss = $("#cmiss").checked;
  store.set("craft", cs);
  st.limit = 40;
  render();
};
["#csucc", "#cbasis", "#cmode", "#cmiss"].forEach((s) => $(s).addEventListener("change", saveCraft));
["#cq", "#ccat", "#csort"].forEach((s) => $(s).addEventListener("input", () => { st.limit = 40; render(); }));
$("#more").addEventListener("click", () => { st.limit += 40; render(); });
["#q", "#cat", "#sort"].forEach((s) => $(s).addEventListener("input", () => { st.limit = 40; render(); }));
$("#dclose").addEventListener("click", () => $("#dlg").close());
$("#dlg").addEventListener("click", (e) => { if (e.target === $("#dlg")) $("#dlg").close(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && st.server && st.sum && Date.now() - new Date(st.sum.generated_at) > 50 * 60e3) loadServer(st.server); });
boot();
</script>
